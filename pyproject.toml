[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ardronics"
version = "0.1.0"
description = "Gel image analysis and 16S ARDRA identification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "biopython>=1.84,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
ardronics = "ardronics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ardronics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "SIM", "EXE"]
ignore = ["E501"]
